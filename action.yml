name: 'Basic checks'
description: 'Basic Vue checks & builds for the template'
runs:
  using: "composite"
  steps:
    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
    - name: Install dependencies
      run: bun install
      shell: bash
    - run: bun run lint:js:all
      shell: bash
    - run: bun run lint:css:all
      shell: bash
    - run: bun run tsc
      shell: bash
    - run: bun run build
      shell: bash
